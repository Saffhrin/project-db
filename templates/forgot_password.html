{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<h2>Forgot Password</h2>
<p>Enter your username and your linked student registration number (<code>reg_no</code>) or faculty employee number (<code>emp_no</code>) to reset your password.</p>

<form method="post" class="form-card">
    <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="form-row">
        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="STUDENT">Student</option>
            <option value="FACULTY">Faculty</option>
        </select>
    </div>

    <div class="form-row">
        <label for="identifier">Your linked ID</label>
        <input type="text" id="identifier" name="identifier" required
               placeholder="For Student: reg_no | For Faculty: emp_no">
    </div>

    <div class="form-row">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required>
    </div>

    <div class="form-row">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </div>

    <button type="submit" class="btn-primary">Reset Password</button>
    <p class="hint">
        <a href="{{ url_for('login') }}">Back to login</a>
    </p>
</form>
{% endblock %}
