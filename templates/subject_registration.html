{% extends "base.html" %}
{% block title %}Subject Registration{% endblock %}
{% block content %}
<h2>Subject Registration</h2>
<form method="post" class="form-card">
    <div class="form-row">
        <label for="subject_code">Subject Code</label>
        <input type="text" id="subject_code" name="subject_code" required placeholder="CS101">
    </div>
    <div class="form-row">
        <label for="subject_name">Subject Name</label>
        <input type="text" id="subject_name" name="subject_name" required placeholder="Database Systems">
    </div>
    <div class="form-row">
        <label for="credits">Credits</label>
        <input type="number" id="credits" name="credits" min="1" max="5" value="4">
    </div>
    <button type="submit" class="btn-primary">Save Subject</button>
</form>
{% endblock %}
